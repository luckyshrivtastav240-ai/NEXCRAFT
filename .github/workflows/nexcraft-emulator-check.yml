name: NEXCRAFT Emulator Validation

on:
  push:
    branches:
      - nexcraft/security-and-hindi

permissions:
  actions: read
  contents: read

jobs:
  emulator:
    name: Install and launch NEXCRAFT in Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download verified ARM64 build-matrix x86_64 APK
        uses: actions/download-artifact@v4
        with:
          name: debug apk (x86_64)
          path: artifacts/apk
          run-id: 41533203238
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify APK exists
        run: |
          APK="$(find artifacts/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Boot emulator, install, launch and capture screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install "$APK_PATH"
            adb shell monkey -p com.movtery.zalithlauncher.v2.debug 1
            sleep 45
            mkdir -p screenshots
            adb shell screencap -p /sdcard/nexcraft-home.png
            adb pull /sdcard/nexcraft-home.png screenshots/nexcraft-home.png
            test -s screenshots/nexcraft-home.png
            file screenshots/nexcraft-home.png

      - name: Upload real emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NEXCRAFT emulator screenshot
          path: screenshots/nexcraft-home.png
          if-no-files-found: error
          retention-days: 14
