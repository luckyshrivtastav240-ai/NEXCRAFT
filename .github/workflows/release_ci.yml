name: Android CI

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Release
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  Upload-to-Release:
    needs: Build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download Files
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Organize Artifacts
        run: |
          mkdir -p ./apks

          find ./artifacts -name "*.apk" -type f -exec cp {} ./apks/ \;

          echo "Found $(ls ./apks/ | wc -l) APK file(s)"

          mkdir -p ./mappings
          version="${GITHUB_REF_NAME#v}"
          for dir in ./artifacts/mapping*; do
            [ -d "$dir" ] || continue
            arch="${dir##*mapping \(}"
            arch="${arch%\)}"
            case "$arch" in
              all) abi="" ;;
              arm) abi="armeabi-v7a" ;;
              arm64) abi="arm64-v8a" ;;
              *) abi="$arch" ;;
            esac
            cp "$dir/mapping.txt" "./mappings/NEXCRAFT-mapping-${version}${abi:+-$abi}.txt"
          done

          echo "Found $(ls ./mappings/ | wc -l) mapping file(s)"

      - name: Upload To Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ./apks/*.apk
            ./mappings/*.txt
          fail_on_unmatched_files: true

      - name: Publish NEXCRAFT update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version_code=$(sed -n 's/^launcher_version_code=//p' ZalithLauncher/gradle.properties | head -n 1)
          version_name=$(sed -n 's/^launcher_version_name=//p' ZalithLauncher/gradle.properties | head -n 1)
          test -n "$version_code"
          test -n "$version_name"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          published_at=$(jq -r '.published_at // .created_at' release.json)
          release_body=$(jq -r '.body // "NEXCRAFT Launcher update."' release.json)

          jq --argjson code "$version_code" \
             --arg version "$version_name" \
             --arg created_at "$published_at" \
             --arg body "$release_body" '
            {
              code: $code,
              version: $version,
              created_at: $created_at,
              default_cloud_drive: null,
              cloud_drives: [],
              files: [
                .assets[]
                | select(.name | endswith(".apk"))
                | {
                    file_name: .name,
                    uri: .browser_download_url,
                    arch: (
                      if (.name | endswith("-armeabi-v7a.apk")) then "arm"
                      elif (.name | endswith("-arm64-v8a.apk")) then "arm64"
                      elif (.name | endswith("-x86_64.apk")) then "x86_64"
                      elif (.name | endswith("-x86.apk")) then "x86"
                      else "all"
                      end
                    ),
                    size: .size
                  }
              ],
              default_body: {language: "en", markdown: $body},
              bodies: []
            }
          ' release.json > latest_version_md.json

          test "$(jq '.files | length' latest_version_md.json)" -gt 0
          gh release upload "$RELEASE_TAG" latest_version_md.json --clobber
