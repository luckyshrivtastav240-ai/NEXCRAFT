name: Build NEXCRAFT AI Player Mod

on:
  workflow_dispatch:
  push:
    branches: [nexcraft/mobile-layout-and-ci]
    paths:
      - "ai-player-mod/**"
      - ".github/workflows/ai-player-mod.yml"

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        run: |
          chmod +x ./gradlew
          ./gradlew -p ai-player-mod build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexcraft-ai-player-fabric-1.20.1
          path: ai-player-mod/build/libs/*.jar
          if-no-files-found: error
