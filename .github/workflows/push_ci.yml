name: Build CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Keep only the newest build for each branch. Rapid commits should not
# leave dozens of obsolete Android matrix builds waiting in the runner queue.
concurrency:
  group: nexcraft-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    uses: ./.github/workflows/build.yml
    with:
      variant: Debug
    secrets:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
