openapi: 3.1.0
info:
  title: NEXCRAFT Main Connector
  version: 1.0.0
  description: Assistant API for pairing with a NEXCRAFT Android launcher, reading redacted diagnostics, viewing the latest user-approved screen frame, and revoking access.
servers:
  - url: https://YOUR-DEPLOYED-RELAY-HOST
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: checkRelayHealth
      security: []
      summary: Check whether the NEXCRAFT relay is online
      responses:
        '200':
          description: Relay status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  api: { type: string }
  /v1/pairings/complete:
    post:
      operationId: pairNexcraftDevice
      security: []
      summary: Pair the NEXCRAFT launcher using its one-time code
      description: Enter the short-lived code shown in NEXCRAFT. The returned assistantToken is shown once; configure it as the Bearer API key for subsequent action calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode]
              properties:
                pairingCode:
                  type: string
                  pattern: '^[A-F0-9]{10}$'
      responses:
        '200':
          description: Device paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairingId: { type: string, format: uuid }
                  assistantToken: { type: string }
                  deviceLabel: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        '404':
          description: Pairing code expired or not found
  /v1/diagnostics:
    get:
      operationId: readNexcraftDiagnostics
      summary: Read recent diagnostics from the paired NEXCRAFT launcher
      description: Returns recent device status, redacted launcher logs, and crash reports. Screen frames are available through viewNexcraftScreen.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Recent diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairingId: { type: string }
                  device: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string }
                        createdAt: { type: string, format: date-time }
                        payload: {}
        '401':
          description: Invalid or revoked assistant token
  /v1/diagnostics/screen:
    get:
      operationId: viewNexcraftScreen
      summary: View the latest user-approved NEXCRAFT screen frame
      description: Returns the most recent JPEG frame captured while Android MediaProjection screen sharing is active. The user can stop capture in NEXCRAFT or its foreground notification.
      responses:
        '200':
          description: Latest screen frame
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: No screen frame has been uploaded
        '401':
          description: Invalid or revoked assistant token
  /v1/pairings/{id}/revoke:
    post:
      operationId: disconnectNexcraftDevice
      summary: Disconnect and revoke the paired NEXCRAFT device
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pairing revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '401':
          description: Invalid or revoked assistant token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: NEXCRAFT assistant pairing token
