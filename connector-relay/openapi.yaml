openapi: 3.1.0
info:
  title: NEXCRAFT Main Connector
  version: 1.3.0
  description: Pair the NEXCRAFT Android launcher with a user-configured assistant. Pairing codes are short-lived; screen sharing requires explicit Android permission.
servers:
  - url: https://nexcraft-connector-relay.luckyshrivastav240.workers.dev
paths:
  /health:
    get:
      operationId: checkRelayHealth
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  api: { type: string }
                  storage: { type: string }
  /v1/pairings/complete:
    post:
      operationId: pairNexcraftDevice
      security: []
      summary: Complete pairing using the 10-character code displayed in NEXCRAFT
      description: Ask the user for the temporary code shown by their launcher. The assistantToken is a secret; never reveal it in user-facing messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode]
              properties:
                pairingCode: { type: string, pattern: '^[A-F0-9]{10}$' }
      responses:
        '200':
          description: Paired
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairingId: { type: string }
                  assistantToken: { type: string }
                  deviceLabel: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        '404': { description: Code expired or not found }
        '409': { description: Code already used }
        '429': { description: Rate limit exceeded }
  /v1/diagnostics:
    get:
      operationId: readNexcraftDiagnostics
      summary: Read redacted diagnostics from the paired device
      parameters:
        - in: header
          name: X-Assistant-Token
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairingId: { type: string }
                  device: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string }
                        createdAt: { type: string, format: date-time }
                        payload: {}
        '401': { description: Invalid assistant token }
    post:
      operationId: uploadNexcraftDiagnostic
      summary: Upload a diagnostic from Android using its device token
      security:
        - DeviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, payload]
              properties:
                kind:
                  type: string
                  enum: [status, log, crash, screen, feature_snapshot]
                payload: {}
      responses:
        '202': { description: Accepted }
        '401': { description: Invalid device token }
  /v1/diagnostics/screen:
    get:
      operationId: viewNexcraftScreen
      summary: Retrieve the latest user-approved JPEG screen snapshot
      parameters:
        - in: header
          name: X-Assistant-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: JPEG snapshot
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { description: No frame available }
        '401': { description: Invalid assistant token }
  /v1/diagnostics/screen/clear:
    post:
      operationId: clearNexcraftScreenFrames
      summary: Clear stored screen frames from Android device
      security:
        - DeviceBearer: []
      responses:
        '200': { description: Cleared }
        '401': { description: Invalid device token }
  /v1/device/disconnect:
    post:
      operationId: disconnectNexcraftDevice
      summary: Disconnect the paired Android device
      security:
        - DeviceBearer: []
      responses:
        '200': { description: Revoked }
        '401': { description: Invalid device token }
  /v1/pairings/{id}/revoke:
    post:
      operationId: revokeNexcraftAssistantPairing
      summary: Revoke the assistant pairing
      parameters:
        - in: header
          name: X-Assistant-Token
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Revoked }
        '401': { description: Invalid assistant token }
components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
