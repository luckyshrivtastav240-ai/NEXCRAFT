openapi: 3.1.0
info:
  title: NEXCRAFT Main Connector
  version: 1.2.0
  description: Pair a NEXCRAFT Android launcher and read user-approved diagnostics and sampled screen frames.
servers:
  - url: https://YOUR-DEPLOYED-RELAY-HOST
paths:
  /health:
    get:
      operationId: checkRelayHealth
      security: []
      summary: Check relay health
      responses:
        '200':
          description: Relay health
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  api: { type: string }
  /v1/pairings/complete:
    post:
      operationId: pairNexcraftDevice
      security: []
      summary: Pair using the one-time code displayed in NEXCRAFT
      description: The returned assistantToken is a secret. Pass it in the X-Assistant-Token header for subsequent calls. Never expose it in ordinary user-facing text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode]
              properties:
                pairingCode:
                  type: string
                  pattern: '^[A-F0-9]{10}$'
      responses:
        '200':
          description: Pairing approved
          content:
            application/json:
              schema:
                type: object
                required: [pairingId, assistantToken, deviceLabel]
                properties:
                  pairingId: { type: string, format: uuid }
                  assistantToken: { type: string }
                  deviceLabel: { type: string }
                  permissions:
                    type: array
                    items: { type: string }
        '404':
          description: Code expired or not found
        '409':
          description: Code already consumed
  /v1/diagnostics:
    get:
      operationId: readNexcraftDiagnostics
      parameters:
        - in: header
          name: X-Assistant-Token
          required: true
          description: Use the assistantToken returned by pairNexcraftDevice. Keep it private.
          schema: { type: string }
      summary: Read recent redacted diagnostics
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Recent diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairingId: { type: string }
                  device: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string }
                        createdAt: { type: string, format: date-time }
                        payload: {}
        '401':
          description: Invalid or revoked token
  /v1/diagnostics/screen:
    get:
      operationId: viewNexcraftScreen
      parameters:
        - in: header
          name: X-Assistant-Token
          required: true
          description: Use the assistantToken returned by pairNexcraftDevice. Keep it private.
          schema: { type: string }
      summary: View the latest user-approved NEXCRAFT screen frame
      description: Returns the most recent JPEG snapshot. Android MediaProjection permission and active foreground service are required.
      responses:
        '200':
          description: Latest JPEG frame
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: No screen frame is available
        '401':
          description: Invalid or revoked token
  /v1/pairings/{id}/revoke:
    post:
      operationId: disconnectNexcraftDevice
      parameters:
        - in: header
          name: X-Assistant-Token
          required: true
          description: Use the assistantToken returned by pairNexcraftDevice. Keep it private.
          schema: { type: string }
      summary: Revoke and disconnect this paired device
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pairing revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '401':
          description: Invalid or revoked token
components: {}
